<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1인 1역 - 관리자 설정</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap');

  :root {
    --primary: #8B5CF6;
    --primary-dark: #7C3AED;
    --primary-light: #A78BFA;
    --primary-bg: #F3EEFF;
    --green: #22C55E;
    --green-dark: #16A34A;
    --red: #F87171;
    --red-dark: #EF4444;
    --orange: #FB923C;
    --bg: #F8F6FF;
    --card: #FFFFFF;
    --border: #E8E5F0;
    --text: #2D2B42;
    --text-light: #8E8BA3;
    --shadow: 0 4px 16px rgba(139,92,246,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 50%, #6D28D9 100%);
    color: white;
    text-align: center;
    padding: 16px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -15px;
    right: -15px;
    width: 70px;
    height: 70px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
  }
  .header h1 {
    font-size: 1.3rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .header p {
    font-size: 0.8rem;
    opacity: 0.85;
    margin-top: 3px;
  }

  /* Content */
  .content {
    max-width: 700px;
    margin: 0 auto;
    padding: 14px 12px 100px;
  }

  /* Section */
  .section {
    background: white;
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 14px;
    transition: all 0.2s;
  }
  .section h2 {
    font-size: 1.05rem;
    color: var(--primary-dark);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
  }

  /* Form */
  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-weight: 700;
    font-size: 0.88rem;
    margin-bottom: 6px;
    color: var(--text);
  }
  .form-group input[type="text"],
  .form-group input[type="date"] {
    width: 100%;
    padding: 11px 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    transition: all 0.2s;
    background: #FAFAFE;
    color: var(--text);
    font-family: inherit;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
  }

  /* Role Editor */
  .role-editor {
    border: 2px solid var(--primary-bg);
    border-radius: 14px;
    padding: 16px 14px 12px;
    margin-bottom: 10px;
    position: relative;
    background: linear-gradient(135deg, #FDFCFF 0%, #F9F7FF 100%);
    transition: all 0.2s;
  }
  .role-editor:hover {
    border-color: var(--primary-light);
    box-shadow: 0 2px 12px rgba(139,92,246,0.08);
  }
  .role-num {
    position: absolute;
    top: -10px;
    left: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-size: 0.72rem;
    font-weight: 800;
    padding: 2px 12px;
    border-radius: 8px;
    letter-spacing: 0.5px;
  }
  .role-field {
    display: flex;
    gap: 8px;
    margin-top: 4px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .role-name-input {
    flex: 1;
    min-width: 130px;
    padding: 9px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 0.92rem;
    font-weight: 700;
    background: white;
    color: var(--text);
    font-family: inherit;
    transition: all 0.2s;
  }
  .students-input {
    flex: 2;
    min-width: 180px;
    padding: 9px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 0.92rem;
    background: white;
    color: var(--text);
    font-family: inherit;
    transition: all 0.2s;
  }
  .role-name-input:focus,
  .students-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
  }
  .remove-role-btn {
    background: none;
    border: 2px solid transparent;
    color: var(--red);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 7px 8px;
    line-height: 1;
    border-radius: 10px;
    transition: all 0.2s;
  }
  .remove-role-btn:hover {
    background: #FFF0F0;
    border-color: #FED7D7;
  }

  /* Days */
  .days-row {
    display: flex;
    gap: 5px;
    margin-top: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .days-label {
    font-size: 0.78rem;
    color: var(--text-light);
    font-weight: 700;
    margin-right: 4px;
  }
  .day-chip {
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid var(--border);
    background: white;
    color: var(--text-light);
    transition: all 0.2s;
  }
  .day-chip:hover {
    border-color: var(--primary-light);
  }
  .day-chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  /* Buttons */
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    padding: 11px 22px;
    border: none;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--green); color: white; }
  .btn-success:hover { background: var(--green-dark); }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover { background: var(--red-dark); }
  .btn-outline {
    background: white;
    color: var(--primary);
    border: 2px solid var(--primary);
  }
  .btn-outline:hover { background: var(--primary-bg); }

  /* Help Text */
  .help-text {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-top: 4px;
    line-height: 1.6;
    background: var(--primary-bg);
    padding: 10px 14px;
    border-radius: 10px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(135deg, #2D2B42, #1E1B32);
    color: white;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.88rem;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Bottom Nav */
  .nav-bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
    display: flex;
    z-index: 100;
    border-top: 1px solid #EDE9FF;
  }
  .nav-bottom a {
    flex: 1;
    text-align: center;
    padding: 8px 0 6px;
    text-decoration: none;
    color: var(--text-light);
    font-size: 0.7rem;
    font-weight: 700;
    transition: all 0.2s;
    position: relative;
  }
  .nav-bottom a.active { color: var(--primary); }
  .nav-bottom a.active::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 3px;
    background: var(--primary);
    border-radius: 0 0 4px 4px;
  }
  .nav-bottom a .nav-icon { display: block; font-size: 1.2rem; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="header">
  <h1>⚙️ 관리자 설정</h1>
  <p>역할과 학생 이름을 편집하세요</p>
</div>

<div class="content">
  <div class="section">
    <h2>🏫 기본 정보</h2>
    <div class="form-group">
      <label>반 이름</label>
      <input type="text" id="classNameInput" placeholder="예: 6학년 1반">
    </div>
    <div class="form-group">
      <label>구호 (슬로건)</label>
      <input type="text" id="mottoInput" placeholder="예: 우리 모두 지켜요">
    </div>
  </div>

  <div class="section">
    <h2>📝 1인 1역 편집</h2>
    <div class="help-text" style="margin-bottom: 14px;">💡 역할 이름과 담당 학생을 입력하세요. 학생이 여러 명이면 쉼표(,)로 구분합니다.<br>요일 버튼을 클릭해서 해당 역할이 나타나는 요일을 선택하세요.</div>
    <div id="rolesContainer"></div>
    <div class="btn-row" style="margin-top: 12px;">
      <button class="btn btn-outline" onclick="addRole()">➕ 역할 추가</button>
    </div>
  </div>

  <div class="section">
    <h2>💾 저장</h2>
    <div class="btn-row">
      <button class="btn btn-success" onclick="saveAll()">✅ 저장하기</button>
      <button class="btn btn-primary" onclick="loadAll()">↩️ 되돌리기</button>
    </div>
  </div>

  <div class="section">
    <h2>🗄️ 데이터 관리</h2>
    <div class="help-text" style="margin-bottom: 12px;">⚠️ 특정 날짜의 체크 데이터를 초기화할 수 있습니다. 이 작업은 되돌릴 수 없어요.</div>
    <div class="form-group">
      <label>초기화할 날짜</label>
      <input type="date" id="resetDateInput">
    </div>
    <div class="btn-row">
      <button class="btn btn-danger" onclick="resetDate()">🗑️ 해당 날짜 초기화</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="nav-bottom">
  <a href="/">
    <span class="nav-icon">✅</span>체크하기
  </a>
  <a href="/role/teacher.html">
    <span class="nav-icon">🔍</span>점검하기
  </a>
  <a href="/role/admin.html" class="active">
    <span class="nav-icon">⚙️</span>관리
  </a>
</nav>

<script>
const dayLabels = ['월','화','수','목','금'];
const dayValues = [1, 2, 3, 4, 5];
let rolesData = [];
let roleIdCounter = 100;

function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function loadAll() {
  const res = await fetch('/api/roles');
  const data = await res.json();
  document.getElementById('classNameInput').value = data.className;
  document.getElementById('mottoInput').value = data.motto;
  rolesData = data.roles.map(r => ({
    ...r,
    days: r.days || [1,2,3,4,5]
  }));
  renderRoles();
}

function renderRoles() {
  const container = document.getElementById('rolesContainer');
  container.innerHTML = '';
  rolesData.forEach((role, idx) => {
    const div = document.createElement('div');
    div.className = 'role-editor';

    let daysHtml = '<div class="days-row"><span class="days-label">요일:</span>';
    dayLabels.forEach((label, di) => {
      const active = (role.days || [1,2,3,4,5]).includes(dayValues[di]) ? 'active' : '';
      daysHtml += `<span class="day-chip ${active}" data-idx="${idx}" data-day="${dayValues[di]}" onclick="toggleDay(this)">${label}</span>`;
    });
    daysHtml += '</div>';

    div.innerHTML = `
      <span class="role-num">${idx + 1}번 역할</span>
      <div class="role-field">
        <input type="text" class="role-name-input" value="${role.role}" placeholder="역할 이름" data-idx="${idx}">
        <input type="text" class="students-input" value="${role.students.join(', ')}" placeholder="학생 이름 (쉼표 구분)" data-idx="${idx}">
        <button class="remove-role-btn" onclick="removeRole(${idx})" title="삭제">✕</button>
      </div>
      ${daysHtml}
    `;
    container.appendChild(div);
  });
}

function toggleDay(el) {
  const idx = parseInt(el.dataset.idx);
  const day = parseInt(el.dataset.day);
  if (!rolesData[idx].days) rolesData[idx].days = [1,2,3,4,5];
  const arr = rolesData[idx].days;
  const i = arr.indexOf(day);
  if (i >= 0) {
    arr.splice(i, 1);
    el.classList.remove('active');
  } else {
    arr.push(day);
    arr.sort();
    el.classList.add('active');
  }
}

function addRole() {
  rolesData.push({ id: ++roleIdCounter, role: '', students: [], days: [1,2,3,4,5] });
  renderRoles();
  const inputs = document.querySelectorAll('.role-name-input');
  if (inputs.length > 0) inputs[inputs.length - 1].focus();
}

function removeRole(idx) {
  if (confirm(`"${rolesData[idx].role || '(빈 역할)'}"을(를) 삭제하시겠습니까?`)) {
    rolesData.splice(idx, 1);
    renderRoles();
  }
}

function collectFormData() {
  const roleInputs = document.querySelectorAll('.role-name-input');
  const studentInputs = document.querySelectorAll('.students-input');
  const roles = [];
  roleInputs.forEach((input, idx) => {
    const roleName = input.value.trim();
    const studentsStr = studentInputs[idx].value.trim();
    const students = studentsStr ? studentsStr.split(',').map(s => s.trim()).filter(s => s) : [];
    roles.push({
      id: rolesData[idx]?.id || idx + 1,
      role: roleName,
      students: students,
      days: rolesData[idx]?.days || [1,2,3,4,5]
    });
  });
  return roles;
}

async function saveAll() {
  const roles = collectFormData();
  const className = document.getElementById('classNameInput').value.trim();
  const motto = document.getElementById('mottoInput').value.trim();

  if (!className) { showToast('⚠️ 반 이름을 입력하세요'); return; }
  const emptyRole = roles.find(r => !r.role);
  if (emptyRole) { showToast('⚠️ 빈 역할 이름이 있습니다'); return; }

  await fetch('/api/roles', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ className, motto, roles })
  });

  rolesData = roles;
  showToast('✅ 저장되었습니다!');
}

async function resetDate() {
  const date = document.getElementById('resetDateInput').value;
  if (!date) { showToast('⚠️ 날짜를 선택하세요'); return; }
  if (!confirm(`${date}의 모든 체크 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) return;
  await fetch(`/api/checks/${date}`, { method: 'DELETE' });
  showToast(`🗑️ ${date} 데이터가 초기화되었습니다`);
}

document.getElementById('resetDateInput').value = getToday();
loadAll();
</script>
</body>
</html>
