<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매일 질문 챌린지</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
          <text x="24" y="30" text-anchor="middle" font-size="24" fill="#FF9800" font-weight="bold">?</text>
          <circle cx="36" cy="10" r="6" fill="#FFD54F"/>
          <path d="M33.5 7.5L38.5 12.5M38.5 7.5L33.5 12.5" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div>
          <h1 class="logo-title">매일 질문 챌린지</h1>
          <p class="logo-sub">하루 한 개, 나만의 질문을 던져보자!</p>
        </div>
      </div>
      <div class="header-stats" id="headerStats">
        <div class="stat-badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>오늘 <strong id="todayCount">0</strong>명 참여</span>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- Login Panel -->
    <section class="login-panel" id="loginPanel">
      <div class="login-card">
        <div class="login-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FF9800" stroke-width="1.5">
            <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
          </svg>
        </div>
        <h2 class="login-title">반가워요! 누구인지 알려주세요</h2>
        <p class="login-desc">반번호와 이름을 입력하면 질문을 올릴 수 있어요.</p>
        <div class="login-form">
          <div class="input-group">
            <label for="inputStudentId">반번호</label>
            <input type="text" id="inputStudentId" placeholder="예: 1304" maxlength="10" autocomplete="off">
          </div>
          <div class="input-group">
            <label for="inputStudentName">이름</label>
            <input type="text" id="inputStudentName" placeholder="예: 홍길동" maxlength="20" autocomplete="off">
          </div>
          <button class="btn btn-primary btn-login" id="btnLogin">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            시작하기
          </button>
        </div>
      </div>
    </section>

    <!-- Main Content (hidden until login) -->
    <div id="mainContent" class="hidden">
      <!-- Question Form -->
      <section class="question-form-section">
        <div class="card question-form-card" id="questionFormCard">
          <div class="card-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF9800" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <h2>오늘의 질문 올리기</h2>
          </div>
          <div class="user-info-bar" id="userInfoBar">
            <span class="user-badge" id="userBadge"></span>
            <button class="btn-text" id="btnLogout">다른 사람으로 변경</button>
          </div>
          <textarea id="questionInput" class="question-textarea" placeholder="궁금한 것, 알고 싶은 것, 생각해볼 만한 것... 무엇이든 좋아요!&#10;오늘의 질문을 적어주세요. (최대 500자)" maxlength="500"></textarea>
          <div class="form-footer">
            <span class="char-count"><span id="charCount">0</span>/500</span>
            <button class="btn btn-primary" id="btnSubmit">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
              질문 올리기
            </button>
          </div>
        </div>
        <!-- Already submitted state -->
        <div class="card already-submitted hidden" id="alreadySubmitted">
          <div class="submitted-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <h3>오늘의 질문을 이미 올렸어요!</h3>
          <p>내일 또 멋진 질문으로 만나요. 아래에서 친구들의 질문도 구경해보세요!</p>
        </div>
      </section>

      <!-- Date Navigation -->
      <section class="date-nav-section">
        <div class="date-nav">
          <button class="btn-icon" id="btnPrevDate" title="이전 날짜">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <div class="date-display" id="dateDisplay">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span id="dateText">오늘</span>
          </div>
          <button class="btn-icon" id="btnNextDate" title="다음 날짜" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
          <button class="btn-icon btn-today" id="btnToday" title="오늘로 이동">
            오늘
          </button>
        </div>
      </section>

      <!-- Questions List -->
      <section class="questions-section">
        <div id="questionsList" class="questions-list">
          <!-- Questions will be rendered here -->
        </div>
        <div class="empty-state hidden" id="emptyState">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#BDBDBD" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <p>아직 올라온 질문이 없어요.</p>
          <p class="empty-sub">첫 번째 질문의 주인공이 되어보세요!</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Toast notification -->
  <div class="toast hidden" id="toast">
    <span id="toastMsg"></span>
  </div>

  <footer class="footer">
    <p>매일 질문 챌린지 &middot; 좋은 질문이 좋은 배움을 만듭니다</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
