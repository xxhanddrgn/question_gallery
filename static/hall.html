<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명예의 전당 - 하루 한 개 질문 챌린지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    'pastel-orange': '#FFB87A',
                    'pastel-coral': '#FF9B9B',
                    'pastel-yellow': '#FFE78A',
                    'pastel-green': '#8FE6B0',
                    'pastel-sky': '#8FC9F9',
                    'pastel-purple': '#C5B5E8',
                    'cream': '#FFFBF5',
                    'cream-dark': '#FFF3E0',
                    'txt': '#2D2424',
                    'txt-light': '#5C4E4E',
                    'txt-lighter': '#8E7E7E',
                },
                fontFamily: {
                    heading: ['"Jua"', 'sans-serif'],
                    body: ['"Gowun Dodum"', 'sans-serif'],
                }
            }
        }
    }
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="font-body bg-cream text-txt min-h-screen">
    <div class="max-w-[600px] mx-auto">
        <!-- Header -->
        <div class="hall-header px-5 py-8 text-center">
            <div class="relative z-10">
                <a href="/" class="inline-block text-left text-sm font-bold text-white/80 hover:text-white transition no-underline mb-3">&lt; 돌아가기</a>
                <div class="text-5xl mb-2">&#9734;</div>
                <h1 class="text-3xl font-heading text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.2)]">명예의 전당</h1>
                <p class="text-sm text-white/80 mt-1 font-semibold">누적 질문 수 기준 우리 학교 질문왕 순위</p>
            </div>
        </div>

        <!-- Podium (Top 3) -->
        <div id="podium" class="px-4 py-5"></div>

        <!-- Full Ranking -->
        <div id="ranking-list" class="px-4 pb-10"></div>

        <!-- Empty State -->
        <div id="empty-ranking" class="text-center py-16 px-5" style="display:none">
            <div class="text-5xl mb-3">&#9734;</div>
            <p class="text-base font-bold text-txt-light">아직 순위가 없어요</p>
            <p class="text-sm text-txt-lighter mt-1">질문을 올리면 순위에 반영됩니다!</p>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
    async function loadRanking() {
        try {
            const res = await fetch('/api/hall-of-fame');
            if (!res.ok) {
                if (res.status === 401) {
                    window.location.href = '/';
                    return;
                }
                throw new Error('데이터를 불러올 수 없습니다');
            }
            const data = await res.json();
            renderRanking(data.ranking);
        } catch (err) {
            console.error(err);
        }
    }

    function renderRanking(ranking) {
        if (!ranking || ranking.length === 0) {
            document.getElementById('empty-ranking').style.display = 'block';
            return;
        }

        document.getElementById('empty-ranking').style.display = 'none';

        // Podium (top 3 ranks)
        const podiumData = ranking.filter(r => r.rank <= 3);
        const podiumEl = document.getElementById('podium');

        if (podiumData.length > 0) {
            // Group by rank
            const grouped = {};
            podiumData.forEach(r => {
                if (!grouped[r.rank]) grouped[r.rank] = [];
                grouped[r.rank].push(r);
            });

            let podiumHtml = '<div class="flex flex-col gap-3">';
            [1, 2, 3].forEach(rank => {
                if (!grouped[rank]) return;
                const badges = ['rank-badge-1', 'rank-badge-2', 'rank-badge-3'];
                const labels = ['1st', '2nd', '3rd'];
                podiumHtml += `
                    <div class="${badges[rank-1]} rounded-2xl p-4 text-center">
                        <div class="text-lg font-heading font-bold text-white mb-2">${labels[rank-1]}</div>
                        <div class="flex flex-wrap justify-center gap-2">
                            ${grouped[rank].map(r => `
                                <div class="bg-white/30 backdrop-blur-sm rounded-xl px-4 py-2 ${r.is_me ? 'ring-2 ring-white' : ''}">
                                    <div class="text-sm font-bold text-white">${r.grade}-${r.class_num} ${escapeHtml(r.name)}</div>
                                    <div class="text-xs text-white/80">${r.question_count}개</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            podiumHtml += '</div>';
            podiumEl.innerHTML = podiumHtml;
        }

        // Rest of ranking (rank > 3)
        const rest = ranking.filter(r => r.rank > 3);
        const listEl = document.getElementById('ranking-list');

        if (rest.length > 0) {
            listEl.innerHTML = rest.map((r, i) => `
                <div class="flex items-center gap-3 px-4 py-3 bg-white rounded-xl shadow-sm mb-2 border border-[#FFE8CC]/20 animate-slideUp ${r.is_me ? 'border-l-4 border-l-pastel-orange bg-cream' : ''}" style="animation-delay: ${i * 0.03}s">
                    <span class="text-lg font-heading font-bold text-txt-light min-w-[35px] text-center">${r.rank}</span>
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold text-white grade-${r.grade}">${r.grade}</div>
                    <div class="flex-1">
                        <span class="text-sm font-bold">${r.grade}-${r.class_num} ${escapeHtml(r.name)}</span>
                    </div>
                    <span class="text-sm font-bold text-pastel-orange">${r.question_count}개</span>
                </div>
            `).join('');
        }
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Init
    loadRanking();
    setInterval(loadRanking, 30000);
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) loadRanking();
    });
    </script>
</body>
</html>
